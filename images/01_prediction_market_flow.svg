<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155" /></marker></defs>
<rect x="20" y="-20" width="1370" height="400" fill="#fff"/>
<text x="450.0" y="52.64" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" fill="#111827">Prediction Market Logic: From Question to Probability Signal</text>
<rect x="60" y="90" width="190" height="85" rx="12" fill="#dcfce7" stroke="#0f172a" stroke-width="2"/>
<text x="155.0" y="128.76" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#111827">1. Future question</text>
<text x="155.0" y="149.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#111827">Will X happen?</text>
<rect x="320" y="70" width="170" height="70" rx="12" fill="#dbeafe" stroke="#0f172a" stroke-width="2"/>
<text x="405.0" y="101.48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#111827">YES share</text>
<text x="405.0" y="121.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#111827">Pays if true</text>
<rect x="320" y="170" width="170" height="70" rx="12" fill="#fee2e2" stroke="#0f172a" stroke-width="2"/>
<text x="405.0" y="201.48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#111827">NO share</text>
<text x="405.0" y="221.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#111827">Pays if false</text>
<rect x="560" y="90" width="210" height="85" rx="12" fill="#fef9c3" stroke="#0f172a" stroke-width="2"/>
<text x="665.0" y="119.22" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#111827">Traders buy/sell</text>
<text x="665.0" y="138.74" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#111827">based on beliefs +</text>
<text x="665.0" y="158.26" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#111827">information</text>
<rect x="840" y="90" width="220" height="85" rx="12" fill="#ede9fe" stroke="#0f172a" stroke-width="2"/>
<text x="950.0" y="128.76" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#111827">Market price</text>
<text x="950.0" y="149.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#111827">updates in real time</text>
<rect x="1120" y="90" width="230" height="85" rx="12" fill="#ccfbf1" stroke="#0f172a" stroke-width="2"/>
<text x="1235.0" y="118.39" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#111827">Implied probability</text>
<text x="1235.0" y="139.13" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#111827">public signal of</text>
<text x="1235.0" y="159.87" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#111827">belief</text>
