<text x="1235.0" y="216.07" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#111827">risk</text>
<rect x="60" y="260" width="390" height="80" rx="12" fill="#f0fdf4" stroke="#0f172a" stroke-width="2"/>
<text x="255.0" y="287.55" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#111827">Example</text>
<text x="255.0" y="305.85" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#111827">YES at 0.65 roughly means market prices</text>
<text x="255.0" y="324.15000000000003" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#111827">the outcome near 65%, before fees/spread.</text>
