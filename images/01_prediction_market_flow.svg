<rect x="560" y="260" width="210" height="80" rx="12" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
<text x="665.0" y="287.55" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#111827">New info</text>
<text x="665.0" y="305.85" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#111827">injury, lineup, poll,</text>
<text x="665.0" y="324.15000000000003" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#111827">macro news</text>
