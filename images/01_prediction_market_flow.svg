<text x="665.0" y="216.07" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#111827">reprices</text>
<rect x="840" y="260" width="220" height="80" rx="12" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
<text x="950.0" y="287.55" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#111827">User decision</text>
<text x="950.0" y="305.85" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#111827">enter, exit, wait, or</text>
<text x="950.0" y="324.15000000000003" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#111827">skip</text>
<line x1="950" y1="260" x2="950" y2="180" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="950.0" y="216.07" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#111827">action</text>
<rect x="1120" y="260" width="230" height="80" rx="12" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
<text x="1235.0" y="287.55" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#111827">Caution</text>
<text x="1235.0" y="305.85" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#111827">price is signal, not</text>
<text x="1235.0" y="324.15000000000003" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#111827">guarantee</text>
